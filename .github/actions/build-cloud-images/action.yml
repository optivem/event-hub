name: 'Build Cloud-only Images'
description: >-
  Builds the images that only exist in Artifact Registry, tagged by the git tree hash of their
  build context and only built when that tag is missing. Needs a registry login and a checkout.
  Keycloak always comes from the checkout at the workspace root, never from source-path: every
  stack shares one instance, so an older source must not roll its realm back.

inputs:
  registry:
    description: 'Artifact Registry path: <region>-docker.pkg.dev/<project>/app-images'
    required: true
  system:
    description: 'System name, baked into the Keycloak realm'
    required: true
  region:
    description: 'GCP region, baked into the Keycloak realm'
    required: true
  project-number:
    description: 'GCP project number, baked into the Keycloak realm'
    required: true
  external-systems:
    description: 'Which external systems image to build: simulators or stubs'
    required: true
  source-path:
    description: 'Checkout holding the migrations and external systems for the version under test'
    required: false
    default: '.'

outputs:
  db-migrate:
    description: 'Flyway image reference'
    value: ${{ steps.build.outputs.db-migrate }}
  keycloak:
    description: 'Keycloak image reference'
    value: ${{ steps.build.outputs.keycloak }}
  external-systems:
    description: 'External systems image reference'
    value: ${{ steps.build.outputs.external-systems }}

runs:
  using: 'composite'
  steps:
    - name: Build and Push
      id: build
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        SYSTEM: ${{ inputs.system }}
        RUN_APP_SUFFIX: ${{ inputs.project-number }}.${{ inputs.region }}.run.app
        EXTERNAL_SYSTEMS: ${{ inputs.external-systems }}
        SOURCE: ${{ inputs.source-path }}
      run: |
        set -euo pipefail
        build() {
          local output="$1" name="$2" root="$3" context="$4"; shift 4
          local tag
          tag="$(git -C "$root" rev-parse --short=12 "HEAD:${context}")"
          local ref="${REGISTRY}/${name}:${tag}"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "Reusing ${ref}"
          else
            docker build -t "$ref" "$@" "${root}/${context}" && docker push "$ref"
          fi
          echo "${output}=${ref}" >> "$GITHUB_OUTPUT"
        }
        build db-migrate db-migrate "$SOURCE" db
        build keycloak keycloak . docker/keycloak -f docker/keycloak/Dockerfile.cloud \
          --build-arg "SYSTEM=${SYSTEM}" --build-arg "RUN_APP_SUFFIX=${RUN_APP_SUFFIX}"
        build external-systems "$EXTERNAL_SYSTEMS" "$SOURCE" "external-systems/${EXTERNAL_SYSTEMS}"
