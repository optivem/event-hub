name: qa-stage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version to deploy (e.g., v1.0.0-rc.1). Leave empty to deploy the latest available RC.'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: qa-stage

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ inputs.version || steps.resolve-latest.outputs.tag }}
      image-urls: ${{ steps.resolve-images.outputs.image-urls }}
    steps:
      - name: Ensure Environment Variables Defined
        uses: optivem/actions/validate-env-vars-defined@v1
        with:
          names: |
            DOCKERHUB_USERNAME
            DOCKERHUB_TOKEN
            WORKFLOW_TOKEN
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
            SYSTEM_NAME
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          SYSTEM_NAME: ${{ vars.SYSTEM_NAME }}

      - name: Resolve Latest RC
        id: resolve-latest
        if: inputs.version == ''
        uses: optivem/actions/resolve-latest-prerelease-tag@v1
        with:
          tag-prefix: v

      - name: Check RC Exists
        if: inputs.version != ''
        uses: optivem/actions/validate-tag-exists@v1
        with:
          tag: ${{ inputs.version }}

      - name: Compose Docker Image URLs
        id: resolve-images
        uses: optivem/actions/compose-docker-image-urls@v1
        with:
          tag: ${{ inputs.version || steps.resolve-latest.outputs.tag }}
          base-image-urls: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/frontend
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/backend

  # === Deploy: Persistent QA Stack ===
  deploy:
    needs: check
    if: needs.check.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      stack: qa
      image-urls: ${{ needs.check.outputs.image-urls }}
      source-ref: ${{ needs.check.outputs.version }}
      environment: qa
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  # === Record the Deployment ===
  # The environment on the deploy job records the workflow's branch; qa-signoff resolves the RC from this record.
  run:
    needs: [check, deploy]
    if: needs.check.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ needs.check.outputs.version }}
      image-urls: ${{ needs.check.outputs.image-urls }}
    steps:
      - name: Record QA Deployment
        uses: optivem/actions/create-deployment@v1
        with:
          ref: ${{ needs.check.outputs.version }}
          environment: qa
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Show QA URL
        env:
          FRONTEND_URL: ${{ needs.deploy.outputs.frontend-url }}
        run: echo "QA is at ${FRONTEND_URL}" >> "$GITHUB_STEP_SUMMARY"

  summary:
    needs: [check, deploy, run]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Summarize Stage
      uses: optivem/actions/render-system-stage-summary@v1
      with:
        stage-name: 'QA Stage'
        stage-result: >-
          ${{ (needs.check.result == 'failure' || needs.deploy.result == 'failure' || needs.run.result == 'failure') && 'failure'
              || (needs.check.result == 'cancelled' || needs.deploy.result == 'cancelled' || needs.run.result == 'cancelled') && 'cancelled'
              || needs.run.result }}
        environment: qa
        success-version: ${{ needs.run.outputs.version }}
        success-artifact-ids: ${{ needs.run.outputs.image-urls }}
