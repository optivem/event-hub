name: acceptance-stage

on:
  schedule:
    - cron: '0 3 * * *'  # Run daily
  workflow_dispatch:
    inputs:
      commit-sha:
        description: 'Git SHA to test (leave empty for latest image)'
        required: false
        type: string
      force:
        description: 'Run even if nothing changed since the last run (e.g. after ./setup-gcp.sh rebuilt the project)'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: acceptance-stage

env:
  COMMIT_SHA: ${{ inputs.commit-sha || github.sha }}

jobs:
  # === Gate: Artifacts Exist? ===
  preflight:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      artifacts-exist: ${{ steps.check-artifacts.outputs.results && !contains(steps.check-artifacts.outputs.results, '"exists":false') }}
      skip-reason: ${{ steps.check-artifacts.outputs.results && contains(steps.check-artifacts.outputs.results, '"exists":false') && 'Not all artifacts published yet — waiting for the commit stage to produce every image.' || '' }}
    steps:
      - name: Check Container Packages Exist
        id: check-artifacts
        uses: optivem/actions/check-ghcr-packages-exist@v1
        with:
          image-urls: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/frontend
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/backend
          token: ${{ secrets.GHCR_TOKEN }}

  # === Should Run? ===
  check:
    needs: preflight
    if: needs.preflight.outputs.artifacts-exist == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
      skip-reason: ${{ steps.gate.outputs.skip-reason }}
      image-digest-urls: ${{ steps.find-latest.outputs.image-digest-urls }}
      latest-updated-at: ${{ steps.find-latest.outputs.latest-updated-at }}
      last-run-at: ${{ steps.last-run.outputs.timestamp }}
      on-main: ${{ steps.check-on-main.outputs.on-branch }}
    steps:
      - name: Ensure Environment Variables Defined
        uses: optivem/actions/validate-env-vars-defined@v1
        with:
          names: |
            WORKFLOW_TOKEN
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
            SYSTEM_NAME
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          SYSTEM_NAME: ${{ vars.SYSTEM_NAME }}

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.COMMIT_SHA }}

      # <> Should Publish RC Tag / Image Tags? <>
      - name: Check Commit on Main
        id: check-on-main
        uses: optivem/actions/check-sha-on-branch@v1
        with:
          commit-sha: ${{ env.COMMIT_SHA }}

      - name: Read Base Version
        id: read-base-version
        uses: optivem/actions/read-base-version@v1
        with:
          file: VERSION

      - name: Check System Release Already Published
        id: check-tag
        uses: optivem/actions/check-tag-exists@v1
        with:
          tag: v${{ steps.read-base-version.outputs.base-version }}

      - name: Log in to GHCR
        uses: optivem/actions/docker-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve Docker Image Digests
        id: find-latest
        uses: optivem/actions/resolve-docker-image-digests@v1
        with:
          base-image-urls: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/frontend
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/backend
          tag: ${{ inputs.commit-sha && format('sha-{0}', inputs.commit-sha) || 'latest' }}

      - name: Get Last Workflow Run
        id: last-run
        uses: optivem/actions/get-last-workflow-run@v1
        with:
          workflow-name: ${{ github.workflow }}

      - name: Check for New Artifacts Since Last Run
        id: artifacts-changed
        uses: optivem/actions/check-timestamp-newer@v1
        with:
          latest: ${{ steps.find-latest.outputs.latest-updated-at }}
          since: ${{ steps.last-run.outputs.timestamp }}

      - name: Detect Test Changes Since Last RC
        id: test-changes
        uses: optivem/actions/check-changes-since-tag@v1
        with:
          tag-patterns: v*-rc.*
          paths: |
            system-test
            .github/workflows/acceptance-stage.yml
            .github/workflows/_deploy-cloud-run.yml

      - name: Evaluate Run Gate
        id: gate
        uses: optivem/actions/evaluate-run-gate@v1
        with:
          skip-conditions: |
            [
              {"when": ${{ steps.check-tag.outputs.exists == 'true' }}, "reason": "Release in progress — version already tagged, awaiting post-release VERSION bump."},
              {"when": ${{ !inputs.force && inputs.commit-sha == '' && steps.artifacts-changed.outputs.newer != 'true' && steps.test-changes.outputs.changed != 'true' }}, "reason": "No new artifacts since last run AND no test/workflow changes since last RC tag." }
            ]

  # === Deploy: Real External Systems ===
  deploy-real:
    needs: check
    if: needs.check.outputs.should-run == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      stack: acceptance-real
      image-urls: ${{ needs.check.outputs.image-digest-urls }}
      source-ref: ${{ inputs.commit-sha || github.sha }}
      environment: acceptance
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  # === Deploy: Stub External Systems ===
  # After deploy-real, not beside it: the two stacks share one Keycloak.
  deploy-stub:
    needs: [check, deploy-real]
    if: needs.check.outputs.should-run == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      stack: acceptance-stub
      image-urls: ${{ needs.check.outputs.image-digest-urls }}
      source-ref: ${{ inputs.commit-sha || github.sha }}
      environment: acceptance
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  # === Run System Tests ===
  run:
    needs: [check, deploy-real, deploy-stub]
    if: needs.check.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    # A hung suite must fail fast instead of burning GitHub's 6h job limit.
    timeout-minutes: 90
    environment: acceptance
    permissions:
      contents: read
      packages: write
    env:
      GH_OPTIVEM_CONFIG: gh-optivem.yaml
      # Enables token acquisition in the TypeScript system tests (opt-in; unset => no auth).
      KEYCLOAK_URL_REAL: ${{ needs.deploy-real.outputs.keycloak-url }}
      KEYCLOAK_URL_STUB: ${{ needs.deploy-stub.outputs.keycloak-url }}
      # configuration-loader.ts overrides test-config-acceptance-{stub,real}.json with these.
      MYSHOP_UI_BASE_URL_REAL: ${{ needs.deploy-real.outputs.frontend-url }}
      MYSHOP_API_BASE_URL_REAL: ${{ needs.deploy-real.outputs.backend-url }}
      ERP_API_BASE_URL_REAL: ${{ needs.deploy-real.outputs.external-systems-url }}/erp
      TAX_API_BASE_URL_REAL: ${{ needs.deploy-real.outputs.external-systems-url }}/tax
      MYSHOP_UI_BASE_URL_STUB: ${{ needs.deploy-stub.outputs.frontend-url }}
      MYSHOP_API_BASE_URL_STUB: ${{ needs.deploy-stub.outputs.backend-url }}
      ERP_API_BASE_URL_STUB: ${{ needs.deploy-stub.outputs.external-systems-url }}/erp
      CLOCK_API_BASE_URL_STUB: ${{ needs.deploy-stub.outputs.external-systems-url }}/clock
      TAX_API_BASE_URL_STUB: ${{ needs.deploy-stub.outputs.external-systems-url }}/tax
      # configuration-loader.ts uses ENVIRONMENT to pick test-config-acceptance-{stub,real}.json.
      ENVIRONMENT: acceptance
    outputs:
      version: ${{ steps.rc-version.outputs.version }}
      image-urls: ${{ steps.tag-images.outputs.tagged-image-urls }}
    steps:
      # === Checkout Code ===
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.COMMIT_SHA }}

      - name: Log in to GHCR
        uses: optivem/actions/docker-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # === Setup Test Harness ===
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: system-test/package-lock.json

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('system-test/package-lock.json') }}

      - name: Install gh-optivem CLI extension
        uses: optivem/actions/install-gh-optivem@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `gh optivem system-test setup` runs the setupCommands block (npm ci +
      # playwright install) once for the whole batch; the per-suite `test
      # system` steps then run against the prepared workspace. The SUT itself
      # was already deployed by the deploy jobs, so no `gh optivem system start`
      # is needed.
      - name: Setup Test Harness
        run: gh optivem system-test setup

      # `system-test run` health-probes systems.yaml before each suite, so this checkout's
      # copy must name the deployed stacks. The committed file stays local-only.
      - name: Point systems.yaml at the Deployed Stacks
        env:
          EXT_URL_REAL: ${{ needs.deploy-real.outputs.external-systems-url }}
          EXT_URL_STUB: ${{ needs.deploy-stub.outputs.external-systems-url }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s|http://localhost:3311|${MYSHOP_UI_BASE_URL_REAL}|" \
            -e "s|http://localhost:8311|${MYSHOP_API_BASE_URL_REAL}|" \
            -e "s|http://localhost:8391|${KEYCLOAK_URL_REAL}|" \
            -e "s|http://localhost:9311|${EXT_URL_REAL}|" \
            -e "s|http://localhost:3312|${MYSHOP_UI_BASE_URL_STUB}|" \
            -e "s|http://localhost:8312|${MYSHOP_API_BASE_URL_STUB}|" \
            -e "s|http://localhost:8392|${KEYCLOAK_URL_STUB}|" \
            -e "s|http://localhost:9312|${EXT_URL_STUB}|" \
            docker/systems.yaml
          if grep -n 'url: .*localhost' docker/systems.yaml; then
            echo "::error::systems.yaml still points at localhost."
            exit 1
          fi

      # === Run Smoke Tests ===
      - name: smoke-stub
        run: gh optivem system-test run --suite smoke-stub
      - name: smoke-real
        run: gh optivem system-test run --suite smoke-real
      # === Run Acceptance Tests ===
      - name: acceptance-parallel-api
        run: gh optivem system-test run --suite acceptance-parallel-api
      - name: acceptance-parallel-ui
        run: gh optivem system-test run --suite acceptance-parallel-ui
      - name: acceptance-isolated-api
        run: gh optivem system-test run --suite acceptance-isolated-api
      - name: acceptance-isolated-ui
        run: gh optivem system-test run --suite acceptance-isolated-ui
      # === Run Contract Tests ===
      - name: contract-stub
        run: gh optivem system-test run --suite contract-stub
      - name: contract-stub-isolated
        run: gh optivem system-test run --suite contract-stub-isolated
      - name: contract-real
        run: gh optivem system-test run --suite contract-real
      # === Run E2E Tests ===
      - name: e2e-api
        run: gh optivem system-test run --suite e2e-api
      - name: e2e-ui
        run: gh optivem system-test run --suite e2e-ui
      # === Tag Release Candidate ===
      - name: Read Base System Version
        id: read-version
        uses: optivem/actions/read-base-version@v1
        with:
          file: VERSION

      - name: Compose Prerelease Version
        if: needs.check.outputs.on-main == 'true'
        id: rc-version
        uses: optivem/actions/compose-prerelease-version@v1
        with:
          base-version: ${{ steps.read-version.outputs.base-version }}
          suffix: rc
          build-number: ${{ github.run_number }}
          prefix: ''

      - name: Tag Docker Images for Prerelease
        if: needs.check.outputs.on-main == 'true'
        id: tag-images
        uses: optivem/actions/tag-docker-images@v1
        with:
          image-urls: ${{ needs.check.outputs.image-digest-urls }}
          tag: ${{ steps.rc-version.outputs.version }}
          registry-username: ${{ github.repository_owner }}
          token: ${{ secrets.GHCR_TOKEN }}

  # === Publish Git Tag ===
  publish-tag:
    needs: [check, run]
    if: needs.check.outputs.on-main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Publish Git Tag
        uses: optivem/actions/publish-tag@v1
        with:
          tag: ${{ needs.run.outputs.version }}
          token: ${{ secrets.WORKFLOW_TOKEN }}

  # === Run Static Code Analysis ===
  sonar:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.COMMIT_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: system-test/package-lock.json

      - name: Run Sonar Analysis
        uses: optivem/actions/retry@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          working-directory: system-test
          command: bash ./run-sonar.sh

  summary:
    needs: [preflight, check, deploy-real, deploy-stub, run, publish-tag, sonar]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Summarize Stage
      uses: optivem/actions/render-system-stage-summary@v1
      with:
        stage-name: 'Acceptance Stage'
        stage-result: >-
          ${{ (needs.preflight.result == 'failure' || needs.check.result == 'failure' || needs.deploy-real.result == 'failure' || needs.deploy-stub.result == 'failure' || needs.run.result == 'failure' || needs.publish-tag.result == 'failure') && 'failure'
              || (needs.preflight.result == 'cancelled' || needs.check.result == 'cancelled' || needs.deploy-real.result == 'cancelled' || needs.deploy-stub.result == 'cancelled' || needs.run.result == 'cancelled' || needs.publish-tag.result == 'cancelled') && 'cancelled'
              || needs.run.result }}
        environment: acceptance
        success-version: ${{ needs.check.outputs.on-main == 'true' && needs.run.outputs.version || 'not computed — non-main run' }}
        success-artifact-ids: ${{ needs.run.outputs.image-urls }}
        skipped-reason: ${{ needs.preflight.outputs.skip-reason || needs.check.outputs.skip-reason }}
        latest-artifact-ids: ${{ needs.check.outputs.image-digest-urls }}
        latest-updated-at: ${{ needs.check.outputs.latest-updated-at }}
        last-run-at: ${{ needs.check.outputs.last-run-at }}
