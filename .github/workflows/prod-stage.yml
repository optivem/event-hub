name: prod-stage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version to deploy (e.g., v1.0.0-rc.1). Leave empty to deploy the latest QA-approved RC.'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: prod-stage

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ inputs.version || steps.resolve-latest.outputs.tag }}
      image-urls: ${{ steps.resolve-images.outputs.image-urls }}
    steps:
      - name: Ensure Environment Variables Defined
        uses: optivem/actions/validate-env-vars-defined@v1
        with:
          names: |
            WORKFLOW_TOKEN
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
            SYSTEM_NAME
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          SYSTEM_NAME: ${{ vars.SYSTEM_NAME }}

      - name: Checkout Repository
        if: inputs.version == ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve Latest QA-Approved RC
        id: resolve-latest
        if: inputs.version == ''
        uses: optivem/actions/resolve-latest-prerelease-with-status@v1
        with:
          tag-prefix: v
          status-context: qa/signoff
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Check RC Exists
        if: inputs.version != ''
        uses: optivem/actions/validate-tag-exists@v1
        with:
          tag: ${{ inputs.version }}

      - name: Check QA Approved
        id: qa-status
        if: inputs.version != ''
        uses: optivem/actions/get-commit-status@v1
        with:
          commit-sha: ${{ inputs.version }}
          context: qa/signoff
          state: success
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Verify QA Approved
        if: inputs.version != '' && steps.qa-status.outputs.state != 'success'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::error::Version $VERSION has no successful qa/signoff commit-status. Cannot deploy to production."
          exit 1

      - name: Generate Release Version
        id: release-version
        uses: optivem/actions/compose-release-version@v1
        with:
          prerelease-version: ${{ inputs.version || steps.resolve-latest.outputs.tag }}

      - name: Check System Release Already Published
        id: check-release-tag
        uses: optivem/actions/check-tag-exists@v1
        with:
          tag: ${{ steps.release-version.outputs.version }}

      - name: Verify System Release Not Yet Published
        if: steps.check-release-tag.outputs.exists == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release-version.outputs.version }}
        run: |
          echo "::error::Version $TAG is already released. Bump the VERSION file and create a new RC."
          exit 1

      - name: Compose Docker Image URLs
        id: resolve-images
        uses: optivem/actions/compose-docker-image-urls@v1
        with:
          tag: ${{ inputs.version || steps.resolve-latest.outputs.tag }}
          base-image-urls: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/frontend
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/backend

  # === Deploy: Persistent Production Stack ===
  deploy:
    needs: check
    if: needs.check.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      stack: prod
      image-urls: ${{ needs.check.outputs.image-urls }}
      source-ref: ${{ needs.check.outputs.version }}
      realm: shop-prod
      environment: production
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  # === Publish the Release ===
  # Only after a successful deploy, so a failed deploy publishes no tag or release.
  run:
    needs: [check, deploy]
    if: needs.check.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.promote.outputs.version }}
      image-urls: ${{ needs.check.outputs.image-urls }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.version }}

      - name: Generate Release Version
        id: promote
        uses: optivem/actions/compose-release-version@v1
        with:
          prerelease-version: ${{ needs.check.outputs.version }}

      - name: Tag Docker Images with System Release Version
        id: tag-images
        uses: optivem/actions/tag-docker-images@v1
        with:
          image-urls: ${{ needs.check.outputs.image-urls }}
          tag: ${{ steps.promote.outputs.version }}
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Publish Release Tag
        uses: optivem/actions/publish-tag@v1
        with:
          tag: ${{ steps.promote.outputs.version }}
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Read Component Base Versions
        id: read-component-versions
        uses: optivem/actions/read-base-versions@v1
        with:
          entries: |
            [
              {"key": "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/backend:${{ needs.check.outputs.version }}",
               "file": "backend/VERSION"},
              {"key": "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/frontend:${{ needs.check.outputs.version }}",
               "file": "frontend/VERSION"}
            ]

      # The system tag is already out, so a component whose version wasn't bumped must not stop the
      # release: it keeps its earlier tags, and the system release identifies this build.
      - name: Drop Components Already Released at Another Commit
        id: new-component-versions
        shell: bash
        env:
          VERSIONS: ${{ steps.read-component-versions.outputs.versions }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          kept='[]'
          while IFS= read -r entry; do
            version="$(jq -r .version <<< "$entry")"
            case "$(jq -r .key <<< "$entry")" in
              */backend:*)  tag="backend-v${version}" ;;
              */frontend:*) tag="frontend-v${version}" ;;
              *)            tag="v${version}" ;;
            esac
            existing="$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)"
            if [[ -n "$existing" && "$existing" != "$head" ]]; then
              echo "::warning::${tag} already exists at ${existing}; leaving it and its image tag as they are."
            else
              kept="$(jq -c --argjson entry "$entry" '. + [$entry]' <<< "$kept")"
            fi
          done < <(jq -c '.[]' <<< "$VERSIONS")
          echo "versions=${kept}" >> "$GITHUB_OUTPUT"

      - name: Compose Component Tags
        id: compose-component-tags
        uses: optivem/actions/compose-tags@v1
        with:
          versions: ${{ steps.new-component-versions.outputs.versions }}

      - name: Tag Docker Images with Component Release Versions
        uses: optivem/actions/tag-docker-images@v1
        with:
          image-tags: ${{ steps.compose-component-tags.outputs.tags }}
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Component Versions for Git Tags
        id: component-tag-versions
        shell: bash
        env:
          VERSIONS: ${{ steps.new-component-versions.outputs.versions }}
        run: |
          backend=$(echo "$VERSIONS" | jq -r '.[] | select(.key | contains("backend")) | .version')
          frontend=$(echo "$VERSIONS" | jq -r '.[] | select(.key | contains("frontend")) | .version')
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - name: Publish Backend Component Release Tag
        if: steps.component-tag-versions.outputs.backend != ''
        uses: optivem/actions/publish-tag@v1
        with:
          tag: backend-v${{ steps.component-tag-versions.outputs.backend }}
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Publish Frontend Component Release Tag
        if: steps.component-tag-versions.outputs.frontend != ''
        uses: optivem/actions/publish-tag@v1
        with:
          tag: frontend-v${{ steps.component-tag-versions.outputs.frontend }}
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Generate Release Notes
        id: release-notes
        uses: optivem/actions/generate-release-notes@v1
        with:
          prerelease-version: ${{ needs.check.outputs.version }}
          release-version: ${{ steps.promote.outputs.version }}
          artifact-urls: ${{ steps.tag-images.outputs.tagged-image-urls }}

      - name: Create GitHub Release
        uses: optivem/actions/create-github-release@v1
        with:
          tag: ${{ steps.promote.outputs.version }}
          title: ${{ steps.release-notes.outputs.title }}
          notes-file: ${{ steps.release-notes.outputs.notes-file }}

      - name: Show Production URL
        env:
          FRONTEND_URL: ${{ needs.deploy.outputs.frontend-url }}
        run: echo "Production is at ${FRONTEND_URL}" >> "$GITHUB_STEP_SUMMARY"

  bump-patch-version:
    needs: run
    if: ${{ !failure() && !cancelled() && needs.run.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/bump-patch-version.yml
    secrets: inherit

  summary:
    needs: [check, deploy, run]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Summarize Stage
      uses: optivem/actions/render-system-stage-summary@v1
      with:
        stage-name: 'Production Stage'
        stage-result: >-
          ${{ (needs.check.result == 'failure' || needs.deploy.result == 'failure' || needs.run.result == 'failure') && 'failure'
              || (needs.check.result == 'cancelled' || needs.deploy.result == 'cancelled' || needs.run.result == 'cancelled') && 'cancelled'
              || needs.run.result }}
        environment: production
        success-version: ${{ needs.run.outputs.version }}
        success-artifact-ids: ${{ needs.run.outputs.image-urls }}
