<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | event-hub prototype</title>
<link rel="stylesheet" href="../organizer/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><img class="brand-logo" id="brand-logo" src="../community-logo.svg" alt=""><span id="brand-name">Tech Excellence</span></a>
  </div>
</header>
<main class="page">
  <div class="narrow">
    <div class="page-head">
      <h1>Log in</h1>
      <p class="meta">Tech Excellence administrators</p>
    </div>
    <section class="card">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" value="ada.example@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password">
      </div>
      <div class="actions"><a class="button" href="administrator-community.html" data-login>Log in</a></div>
    </section>
    <p class="proto-next">Next in the flow: log in to set your community's name and logo and manage its organizers and administrators. Ada is also a speaker and an organizer, so her account menu lets her switch role.</p>
  </div>
  <p class="proto-next"><a href="../index.html">All prototypes</a></p>
</main>
<script src="../account.js"></script>
</body>
</html>
