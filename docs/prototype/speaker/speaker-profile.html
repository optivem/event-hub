<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile | event-hub prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="speaker-home.html"><img class="brand-logo" src="../community-logo.svg" alt="">Tech Excellence</a>
    <a class="button secondary help-link" href="speaker-help.html">Need help?</a>
    <details class="account">
      <summary aria-label="Account menu: Mara Sample"><img class="avatar" src="mara-sample-photo.svg" alt=""></summary>
      <ul class="account-menu">
        <li><a href="speaker-events.html">My Events</a></li>
        <li><a href="speaker-profile.html">My Profile</a></li>
        <li><a href="index.html">Log out</a></li>
      </ul>
    </details>
  </div>
</header>
<main class="page">
  <div class="page-head">
    <h1>My Profile</h1>
    <p class="meta">Mara Sample &middot; Used for your talks at Tech Excellence. Events with a submitted agenda keep the copy saved then.</p>
  </div>
  <div>
    <div>
      <section class="card">
        <h2>About you</h2>
        <div class="field">
          <label for="photo">Photo
            <span class="hint">Required. A professional headshot, shown with your talk.</span>
          </label>
          <div class="photo-field">
            <img class="photo-preview" id="photo-preview" src="mara-sample-photo.svg" alt="Your current photo">
            <input id="photo" type="file" accept="image/*">
          </div>
        </div>
        <div class="field">
          <label for="speaker-name">Name
            <span class="hint">From your invitation. Use Need help if it needs changing.</span>
          </label>
          <input id="speaker-name" type="text" value="Mara Sample" readonly>
        </div>
        <div class="field">
          <label for="role">Role</label>
          <input id="role" type="text" data-saved="Staff Engineer">
        </div>
        <div class="field">
          <label for="company">Company</label>
          <input id="company" type="text" data-saved="Sample Company">
        </div>
        <div class="field">
          <label for="bio">Short bio</label>
          <textarea id="bio" rows="4" data-saved="Mara has spent 15 years working on old systems and helps teams get them under test."></textarea>
        </div>
        <div class="field">
          <label for="linkedin">LinkedIn
            <span class="hint">Required</span>
          </label>
          <input id="linkedin" type="url" required data-saved="https://www.linkedin.com/in/mara-sample">
        </div>
        <div class="field">
          <label for="github">GitHub <span class="hint">Required</span></label>
          <input id="github" type="url" required data-saved="https://github.com/mara-sample">
        </div>
        <div class="field">
          <label for="twitter">Twitter / X <span class="hint">Optional</span></label>
          <input id="twitter" type="url">
        </div>
        <div class="field">
          <label for="youtube">YouTube <span class="hint">Optional</span></label>
          <input id="youtube" type="url">
        </div>
        <div class="field">
          <label for="website">Website or blog <span class="hint">Optional</span></label>
          <input id="website" type="url">
        </div>
        <div class="actions"><a class="button" id="account-save" href="speaker-home.html">Save</a></div>
      </section>
    </div>
  </div>
  <p class="proto-next" id="account-next">Next in the flow: <a href="speaker-home.html">back to your event</a></p>
</main>
<script>
var accountParams = new URLSearchParams(location.search);
var photoPreview = document.getElementById('photo-preview');
document.getElementById('photo').addEventListener('change', function (event) {
  var file = event.target.files[0];
  if (!file) { return; }
  var url = URL.createObjectURL(file);
  photoPreview.src = url;
  photoPreview.hidden = false;
  document.querySelector('.topbar .avatar').src = url;
});
if (accountParams.has('onboarding')) {
  var head = document.querySelector('.page-head');
  head.querySelector('h1').textContent = 'Welcome to Tech Excellence';
  head.querySelector('.meta').textContent = 'Tell us about you first. You only do this once, and we use it for all your events.';
  document.querySelector('.account').hidden = true;
  photoPreview.hidden = true;
  var save = document.getElementById('account-save');
  save.textContent = 'Save and continue';
  save.href = 'speaker-date.html';
  document.getElementById('account-next').innerHTML = 'Next in the flow: <a href="speaker-date.html">does this date work for you?</a>';
} else {
  document.querySelectorAll('[data-saved]').forEach(function (field) { field.value = field.dataset.saved; });
  if (accountParams.has('back')) { document.getElementById('account-save').href = accountParams.get('back'); }
}
</script>
</body>
</html>
