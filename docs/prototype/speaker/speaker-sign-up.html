<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account | event-hub prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="proto-bar">
  <span>Prototype: nothing is saved</span>
  <a href="../index.html">All screens</a>
</div>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="speaker-home.html">event-hub</a>
    <nav class="roles" aria-label="View as role">
      <a href="speaker-home.html" aria-current="true">Speaker</a>
      <a href="../organizer/organizer-home.html">Coordinator</a>
      <a href="../organizer/organizer-speakers.html">Organizers</a>
    </nav>
  </div>
</header>
<main class="page">
  <div class="page-head">
    <h1>Create your account</h1>
    <p class="meta">Tech Excellence meetup &middot; Invitation for Mara Sample</p>
  </div>
  <div class="columns">
    <section class="card">
      <h2>New to event-hub</h2>
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" type="text" value="Mara Sample">
      </div>
      <div class="field">
        <label for="email">Your email</label>
        <input id="email" type="email" value="mara.sample@example.com">
      </div>
      <div class="field">
        <label for="password">Choose a password</label>
        <input id="password" type="password">
      </div>
      <div class="actions"><a class="button" href="speaker-date.html">Create account</a></div>
    </section>
    <section class="card">
      <h2>Already have an account</h2>
      <div class="field">
        <label for="signin-email">Your email</label>
        <input id="signin-email" type="email">
      </div>
      <div class="field">
        <label for="signin-password">Password</label>
        <input id="signin-password" type="password">
      </div>
      <div class="actions"><a class="button secondary" href="speaker-date.html">Sign in</a></div>
    </section>
  </div>
</main>
</body>
</html>
