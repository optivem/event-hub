<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propose a talk | event-hub prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="proto-bar">
  <span>Prototype: nothing is saved</span>
  <a href="index.html">Back to login</a>
</div>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="speaker-home.html">event-hub</a>
    <a class="button secondary help-link" href="speaker-help.html">Need help?</a>
    <details class="account">
      <summary aria-label="Account menu: Mara Sample"><img class="avatar" src="mara-sample-photo.svg" alt=""></summary>
      <ul class="account-menu">
        <li><a href="speaker-events.html">My Events</a></li>
        <li><a href="speaker-profile.html">My Profile</a></li>
        <li><a href="index.html">Log out</a></li>
      </ul>
    </details>
  </div>
</header>
<main class="page">
  <div class="page-head">
    <h1>Propose a talk</h1>
    <p class="meta">Spoken at Tech Excellence before? Tell us about your next talk.</p>
  </div>
  <section class="card">
    <div class="field">
      <label for="title">Talk title</label>
      <input id="title" type="text" value="Testing Legacy Code Without Fear">
    </div>
    <div class="field">
      <label for="topic">What is the talk about?</label>
      <textarea id="topic" rows="4">How to get legacy code under test safely, one small step at a time.</textarea>
    </div>
    <div class="field">
      <label for="practical">Anything practical we should know?</label>
      <textarea id="practical" rows="2"></textarea>
    </div>
    <div class="actions"><a class="button" href="speaker-home.html">Send proposal</a></div>
  </section>
  <p class="proto-next">Next in the flow: the organizers see your proposal in their potential speakers. <a href="speaker-home.html">Back to your event</a></p>
</main>
</body>
</html>
