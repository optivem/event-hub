<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propose a talk | event-hub prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="proto-bar">
  <span>Prototype: nothing is saved</span>
  <a href="../index.html">All screens</a>
</div>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="speaker-home.html">event-hub</a>
    <nav class="roles" aria-label="View as role">
      <a href="speaker-home.html" aria-current="true">Speaker</a>
      <a href="../organizer/organizer-home.html">Coordinator</a>
      <a href="../organizer/organizer-speakers.html">Organizers</a>
    </nav>
  </div>
</header>
<main class="page">
  <div class="page-head">
    <h1>Propose a talk</h1>
    <p class="meta">Spoken at Tech Excellence before? Tell us about your next talk.</p>
  </div>
  <section class="card">
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" type="text" value="Mara Sample">
    </div>
    <div class="field">
      <label for="email">Your email</label>
      <input id="email" type="email" value="mara.sample@example.com">
    </div>
    <div class="field">
      <label for="title">Talk title</label>
      <input id="title" type="text" value="Testing Legacy Code Without Fear">
    </div>
    <div class="field">
      <label for="topic">What is the talk about?</label>
      <textarea id="topic" rows="4">How to get legacy code under test safely, one small step at a time.</textarea>
    </div>
    <div class="field">
      <label for="practical">Anything practical we should know?</label>
      <textarea id="practical" rows="2"></textarea>
    </div>
    <div class="actions"><a class="button" href="../organizer/organizer-speakers.html">Send proposal</a></div>
  </section>
  <p class="proto-next">Next in the flow: <a href="../organizer/organizer-speakers.html">organizers see the proposal in potential speakers</a></p>
</main>
</body>
</html>
